# https://github.com/TecharoHQ/anubis
services:
  anubis:
    container_name: anubis
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: anubis
    image: ${ANUBIS_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.anubis.entrypoints=web,websecure"
      - "traefik.http.routers.anubis.rule=Host(`${ANUBIS_HOST}`)"
      - "traefik.http.routers.anubis.tls=true"
      - "traefik.http.routers.anubis.tls.certresolver=letsencrypt"
      - "traefik.http.routers.anubis.tls.domains[0].main=${ANUBIS_HOST}"
      - "traefik.http.routers.anubis.service=anubis"
      # Services
      - "traefik.http.services.anubis.loadbalancer.server.port=8080"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      proxy-net:
        ipv4_address: ${ANUBIS_IP}
    ports:
      - 8080
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/anubis:/data

networks:
  proxy-net:
    external: true
    name: traefik-net
