services:
  # https://github.com/crowdsecurity/crowdsec
  crowdsec:
    container_name: crowdsec
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    expose:
      - 8080 # http api for bouncers
      - 6060 # metrics endpoint for prometheus
      - 7422 # appsec waf endpoint
    hostname: crowdsec
    image: ${CROWDSEC_IMAGE}
    labels:
      # Dozzle
      - "dev.dozzle.url=https://app.crowdsec.net"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      monitoring-net:
        ipv4_address: ${CROWDSEC_MONITORING_IP}
      proxy-net:
        ipv4_address: ${CROWDSEC_IP}
    ports:
      - 127.0.0.1:9876:8080 # port mapping for local firewall bouncers
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/crowdsec/data:/var/lib/crowdsec/data
      - /opt/persistence/crowdsec/etc:/etc/crowdsec
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /opt/persistence/traefik/log:/var/log/traefik:ro

  # https://github.com/TheDuffman85/crowdsec-web-ui
  crowdsec-webui:
    container_name: crowdsec-webui
    depends_on:
      crowdsec:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: 1g
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env.webui
    hostname: crowdsec-webui
    image: ${CROWDSEC_WEBUI_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.crowdsec-webui.entrypoints=web,websecure"
      - "traefik.http.routers.crowdsec-webui.rule=Host(`${CROWDSEC_WEBUI_HOST}`)"
      - "traefik.http.routers.crowdsec-webui.tls=true"
      - "traefik.http.routers.crowdsec-webui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crowdsec-webui.tls.domains[0].main=${CROWDSEC_WEBUI_HOST}"
      - "traefik.http.routers.crowdsec-webui.service=crowdsec-webui"
      # Services
      - "traefik.http.services.crowdsec-webui.loadbalancer.server.port=3000"
      # Dozzle
      - "dev.dozzle.url=https://${CROWDSEC_WEBUI_HOST}"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: 1g
    networks:
      proxy-net:
        ipv4_address: ${CROWDSEC_WEBUI_IP}
    ports:
      - 3000
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/crowdsec-webui:/app/data

networks:
  monitoring-net:
    external: true
    name: monitoring-net
  proxy-net:
    external: true
    name: traefik-net
