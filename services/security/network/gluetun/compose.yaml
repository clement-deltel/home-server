# https://github.com/passteque/gluetun
services:
  gluetun:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: gluetun
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: gluetun
    image: ${GLUETUN_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      # gluetun
      - "traefik.http.routers.gluetun.entrypoints=web,websecure"
      - "traefik.http.routers.gluetun.rule=Host(`${GLUETUN_HOST}`)"
      - "traefik.http.routers.gluetun.tls=true"
      - "traefik.http.routers.gluetun.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gluetun.tls.domains[0].main=${GLUETUN_HOST}"
      - "traefik.http.routers.gluetun.service=gluetun"
      # qbittorrent
      - "traefik.http.routers.qbittorrent.entrypoints=web,websecure"
      - "traefik.http.routers.qbittorrent.rule=Host(`${QBITTORRENT_HOST}`)"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qbittorrent.tls.domains[0].main=${QBITTORRENT_HOST}"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      # Services
      - "traefik.http.services.gluetun.loadbalancer.server.port=8000"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      rr-net:
        ipv4_address: ${GLUETUN_RR_IP}
      proxy-net:
        ipv4_address: ${GLUETUN_IP}
    ports:
      - ${TORRENT_PORT}:6881 # QBittorrent
      - ${TORRENT_PORT}:6881/udp # QBittorrent
      - 8000 # Control Server
      # - 8388:8388/tcp # Shadowsocks
      # - 8388:8388/udp # Shadowsocks
      # - 8888:8888/tcp # HTTP proxy
      - 8080 # QBittorrent WebUI
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/gluetun:/gluetun

networks:
  rr-net:
    external: true
    name: rr-net
  proxy-net:
    external: true
    name: traefik-net
