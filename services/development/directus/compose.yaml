# https://github.com/directus/directus
services:
  cache:
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: directus-cache
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    environment:
      - VALKEY_EXTRA_FLAGS=--requirepass ${DIRECTUS_CACHE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --raw INCR PING"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    hostname: directus-cache
    image: ${DEFAULT_CACHE_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 2m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${DIRECTUS_CACHE_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - /mnt/ssd/cache/directus:/data

  db:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    cap_drop:
      - ALL
    container_name: directus-db
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    env_file: config/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIRECTUS_DB_USERNAME} -d postgres"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    hostname: directus-db
    image: ${DEFAULT_DB_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 5m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${DIRECTUS_DB_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 30s
    volumes:
      - /mnt/ssd/databases/directus:/var/lib/postgresql

  directus:
    container_name: directus
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: directus
    image: ${DIRECTUS_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.directus.entrypoints=web,websecure"
      - "traefik.http.routers.directus.rule=Host(`${DIRECTUS_HOST}`)"
      - "traefik.http.routers.directus.tls=true"
      - "traefik.http.routers.directus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.directus.tls.domains[0].main=${DIRECTUS_HOST}"
      - "traefik.http.routers.directus.service=directus"
      # Services
      - "traefik.http.services.directus.loadbalancer.server.port=8055"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      internal-net:
        ipv4_address: ${DIRECTUS_INTERNAL_IP}
      proxy-net:
        ipv4_address: ${DIRECTUS_IP}
    ports:
      - 8055
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/directus/uploads:/directus/uploads
      - /opt/persistence/directus/extensions:/directus/extensions

networks:
  internal-net:
    name: internal-directus
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DIRECTUS_NET}
          gateway: ${DIRECTUS_GATEWAY}
  proxy-net:
    external: true
    name: traefik-net
