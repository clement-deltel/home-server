# https://github.com/morpheus65535/bazarr
services:
  bazarr:
    container_name: bazarr
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: bazarr
    image: ${BAZARR_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.bazarr.entrypoints=web,websecure"
      - "traefik.http.routers.bazarr.rule=Host(`${BAZARR_HOST}`)"
      - "traefik.http.routers.bazarr.tls=true"
      # - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.bazarr.tls.domains[0].main=${BAZARR_HOST}"
      - "traefik.http.routers.bazarr.service=bazarr"
      # Services
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      rr-net:
        ipv4_address: ${BAZARR_RR_IP}
      proxy-net:
        ipv4_address: ${BAZARR_IP}
    restart: unless-stopped
    ports:
      - 6767
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/bazarr:/config
      - /opt/media:/media

networks:
  rr-net:
    external: true
    name: rr-net
  proxy-net:
    external: true
    name: traefik-net
