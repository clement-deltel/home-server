# https://github.com/Radarr/Radarr
services:
  radarr:
    container_name: radarr
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: radarr
    image: ${RADARR_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.radarr.entrypoints=web,websecure"
      - "traefik.http.routers.radarr.rule=Host(`${RADARR_HOST}`)"
      - "traefik.http.routers.radarr.tls=true"
      # - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.radarr.tls.domains[0].main=${RADARR_HOST}"
      - "traefik.http.routers.radarr.service=radarr"
      # Services
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      rr-net:
        ipv4_address: ${RADARR_RR_IP}
      proxy-net:
        ipv4_address: ${RADARR_IP}
    restart: unless-stopped
    ports:
      - 7878
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/radarr:/config
      - /opt/media:/media

networks:
  rr-net:
    external: true
    name: rr-net
  proxy-net:
    external: true
    name: traefik-net
