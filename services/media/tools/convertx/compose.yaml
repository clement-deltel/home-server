# https://github.com/C4illin/ConvertX
services:
  convertx:
    container_name: convertx
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: convertx
    image: ${CONVERTX_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.convertx.entrypoints=web,websecure"
      - "traefik.http.routers.convertx.rule=Host(`${CONVERTX_HOST}`)"
      - "traefik.http.routers.convertx.tls=true"
      - "traefik.http.routers.convertx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.convertx.tls.domains[0].main=${CONVERTX_HOST}"
      - "traefik.http.routers.convertx.service=convertx"
      # Services
      - "traefik.http.services.convertx.loadbalancer.server.port=3000"
      # Dozzle
      - "dev.dozzle.url=https://${CONVERTX_HOST}"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      proxy-net:
        ipv4_address: ${CONVERTX_IP}
    ports:
      - 3000
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/convertx:/app/data

networks:
  proxy-net:
    external: true
    name: traefik-net
