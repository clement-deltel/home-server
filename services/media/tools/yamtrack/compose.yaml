# https://github.com/FuzzyGrim/Yamtrack
services:
  cache:
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    container_name: yamtrack-cache
    env_file: config/.env.cache
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --raw INCR PING"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    hostname: yamtrack-cache
    image: ${DEFAULT_CACHE_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 2m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${YAMTRACK_CACHE_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - /mnt/ssd/cache/yamtrack:/data

  db:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    cap_drop:
      - ALL
    container_name: yamtrack-db
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    env_file: config/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YAMTRACK_DB_USERNAME} -d postgres"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    hostname: yamtrack-db
    image: ${DEFAULT_DB_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 5m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${YAMTRACK_DB_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 30s
    volumes:
      - /mnt/ssd/databases/yamtrack:/var/lib/postgresql

  yamtrack:
    # cap_add:
    # cap_drop:
    #   - ALL
    container_name: yamtrack
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ || exit 1"]
    #   interval: 20s
    #   retries: 3
    #   start_interval: 5s
    #   start_period: 60s
    #   timeout: 15s
    hostname: yamtrack
    image: ${YAMTRACK_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.yamtrack.entrypoints=web-external,websecure-external"
      - "traefik.http.routers.yamtrack.rule=Host(`${YAMTRACK_HOST}`)"
      - "traefik.http.routers.yamtrack.tls=true"
      - "traefik.http.routers.yamtrack.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yamtrack.tls.domains[0].main=${YAMTRACK_HOST}"
      - "traefik.http.routers.yamtrack.service=yamtrack"
      # Services
      - "traefik.http.services.yamtrack.loadbalancer.server.port=8000"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${YAMTRACK_INTERNAL_IP}
      proxy-net:
        ipv4_address: ${YAMTRACK_IP}
    ports:
      - 8000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

networks:
  internal-net:
    name: internal-yamtrack
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${YAMTRACK_NET}
          gateway: ${YAMTRACK_GATEWAY}
  proxy-net:
    external: true
    name: traefik-net
