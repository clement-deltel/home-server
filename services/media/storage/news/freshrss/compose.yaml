# https://github.com/FreshRSS/FreshRSS
services:
  db:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    cap_drop:
      - ALL
    container_name: freshrss-db
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    env_file: config/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FRESHRSS_DB_USERNAME} -d postgres"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 10s
    hostname: freshrss-db
    image: ${DEFAULT_DB_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 5m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${FRESHRSS_DB_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 30s
    volumes:
      - /mnt/ssd/databases/freshrss:/var/lib/postgresql

  freshrss:
    container_name: freshrss
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: freshrss
    image: ${FRESHRSS_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.freshrss.entrypoints=web-external,websecure-external"
      - "traefik.http.routers.freshrss.rule=Host(`${FRESHRSS_HOST}`)"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.routers.freshrss.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freshrss.tls.domains[0].main=${FRESHRSS_HOST}"
      - "traefik.http.routers.freshrss.service=freshrss"
      # Services
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      internal-net:
        ipv4_address: ${FRESHRSS_INTERNAL_IP}
      proxy-net:
        ipv4_address: ${FRESHRSS_IP}
    ports:
      - 80
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/freshrss:/config

networks:
  internal-net:
    name: internal-freshrss
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${FRESHRSS_NET}
          gateway: ${FRESHRSS_GATEWAY}
  proxy-net:
    external: true
    name: traefik-net
