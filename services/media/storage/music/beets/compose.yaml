# https://github.com/beetbox/beets
services:
  beets:
    container_name: beets
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    env_file: config/.env
    hostname: beets
    image: ${BEETS_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.beets.entrypoints=web,websecure"
      - "traefik.http.routers.beets.rule=Host(`${BEETS_HOST}`)"
      - "traefik.http.routers.beets.tls=true"
      - "traefik.http.routers.beets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.beets.tls.domains[0].main=${BEETS_HOST}"
      - "traefik.http.routers.beets.service=beets"
      # Services
      - "traefik.http.services.beets.loadbalancer.server.port=8337"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      rr-net:
        ipv4_address: ${BEETS_RR_IP}
      proxy-net:
        ipv4_address: ${BEETS_IP}
    ports:
      - 8337
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    user: ${USER_UID}:${USER_GID}
    volumes:
      - /opt/persistence/beets:/config
      - /opt/media/music:/music
      - /opt/media/downloads/music:/downloads

networks:
  rr-net:
    external: true
    name: rr-net
  proxy-net:
    external: true
    name: traefik-net
