services:
  navidrome:
    container_name: navidrome
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: navidrome
    image: ${NAVIDROME_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.navidrome.entrypoints=web,websecure"
      - "traefik.http.routers.navidrome.rule=Host(`${NAVIDROME_HOST}`)"
      - "traefik.http.routers.navidrome.tls=true"
      - "traefik.http.routers.navidrome.tls.certresolver=letsencrypt"
      - "traefik.http.routers.navidrome.tls.domains[0].main=${NAVIDROME_HOST}"
      - "traefik.http.routers.navidrome.service=navidrome"
      # Services
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
      # Dozzle
      - "dev.dozzle.url=https://${NAVIDROME_HOST}"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      proxy-net:
        ipv4_address: ${NAVIDROME_IP}
    ports:
      - 4533
    restart: unless-stopped
    stop_grace_period: 30s
    user: ${USER_UID}:${USER_GID} # should be owner of volumes
    volumes:
      - /opt/persistence/navidrome/backup:/backup
      - /opt/persistence/navidrome/data:/data
      - /opt/media/music/:/music:ro

networks:
  proxy-net:
    external: true
    name: traefik-net
