services:
  karakeep:
    # https://github.com/karakeep-app/karakeep
    container_name: karakeep
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: karakeep
    image: ${KARAKEEP_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.karakeep.entrypoints=web,websecure"
      - "traefik.http.routers.karakeep.rule=Host(`${KARAKEEP_HOST}`)"
      - "traefik.http.routers.karakeep.tls=true"
      - "traefik.http.routers.karakeep.tls.certresolver=letsencrypt"
      - "traefik.http.routers.karakeep.tls.domains[0].main=${KARAKEEP_HOST}"
      - "traefik.http.routers.karakeep.service=karakeep"
      # Services
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"
      # Dozzle
      - "dev.dozzle.url=https://${KARAKEEP_HOST}"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${KARAKEEP_INTERNAL_IP}
      proxy-net:
        ipv4_address: ${KARAKEEP_IP}
    ports:
      - 3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/karakeep/data:/data

  chrome:
    command:
      - --disable-blink-features=AutomationControlled
      - --disable-dev-shm-usage
      - --disable-gpu
      - --hide-scrollbars
      - --no-sandbox
      - --window-size=1440,900
    container_name: karakeep-chrome
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    hostname: karakeep-chrome
    image: ${KARAKEEP_CHROME_IMAGE}
    init: true
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 5m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${KARAKEEP_CHROME_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  meilisearch:
    # https://github.com/meilisearch/meilisearch
    container_name: karakeep-meilisearch
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    env_file: config/.env
    hostname: karakeep-meilisearch
    image: ${MEILISEARCH_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 2
        max-size: 5m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      internal-net:
        ipv4_address: ${KARAKEEP_MEILISEARCH_IP}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/karakeep/meilisearch:/meili_data

networks:
  internal-net:
    name: internal-karakeep
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${KARAKEEP_NET}
          gateway: ${KARAKEEP_GATEWAY}
  proxy-net:
    external: true
    name: traefik-net
