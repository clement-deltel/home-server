services:
  obsidian-livesync:
    container_name: obsidian-livesync
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: obsidian-livesync
    image: ${OBSIDIAN_COUCHDB_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.obsidian.entrypoints=web,websecure"
      - "traefik.http.routers.obsidian.rule=Host(`${OBSIDIAN_COUCHDB_HOST}`)"
      - "traefik.http.routers.obsidian.tls=true"
      # - "traefik.http.routers.obsidian.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.obsidian.tls.domains[0].main=${OBSIDIAN_COUCHDB_HOST}"
      - "traefik.http.routers.obsidian.service=obsidian"
      # Services
      - "traefik.http.services.obsidian.loadbalancer.server.port=5984"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      traefik-net:
        ipv4_address: ${OBSIDIAN_IP}
    ports:
      - 5984
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/obsidian/couchdb-data:/opt/couchdb/data
      - /opt/persistence/obsidian/couchdb-etc:/opt/couchdb/etc/local.d

networks:
  traefik-net:
    external: true
    name: traefik-net
