# https://github.com/dgtlmoon/changedetection.io
services:
  detection:
    container_name: change-detection
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: change-detection
    image: ${CHANGE_DETECTION_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.change-detection.entrypoints=web-external,websecure-external"
      - "traefik.http.routers.change-detection.rule=Host(`${CHANGE_DETECTION_HOST}`)"
      - "traefik.http.routers.change-detection.tls=true"
      - "traefik.http.routers.change-detection.tls.certresolver=letsencrypt"
      - "traefik.http.routers.change-detection.tls.domains[0].main=${CHANGE_DETECTION_HOST}"
      - "traefik.http.routers.change-detection.service=change-detection"
      # Services
      - "traefik.http.services.change-detection.loadbalancer.server.port=5000"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      proxy-net:
        ipv4_address: ${CHANGE_DETECTION_IP}
    ports:
      - 5000
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/change-detection:/datastore

networks:
  proxy-net:
    external: true
    name: traefik-net
