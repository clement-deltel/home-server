# https://github.com/mimnix/FlareProxy
services:
  flareproxy:
    container_name: flareproxy
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: flareproxy
    image: ${FLAREPROXY_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      proxy-net:
        ipv4_address: ${FLAREPROXY_IP}
    ports:
      - 8080
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  proxy-net:
    external: true
    name: traefik-net
