# https://github.com/Flaresolverr/Flaresolverr
# https://github.com/browserless/browserless
services:
  flaresolverr:
    container_name: flaresolverr
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: flaresolverr
    image: ${FLARESOLVERR_IMAGE}
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    networks:
      proxy-net:
        ipv4_address: ${FLARESOLVERR_IP}
    ports:
      - 8191
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/persistence/flaresolverr:/config

networks:
  proxy-net:
    external: true
    name: traefik-net
