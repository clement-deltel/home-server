services:
  pihole:
    cap_add:
      # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
      # Ownership of log files and databases in case FTL is started as a different user than pihole
      - CHOWN
      # Pi-hole as DHCP server, else not needed
      # - NET_ADMIN
      # FTLDNS binding to TCP/UDP sockets below 1024 (specifically DNS service on port 53)
      - NET_BIND_SERVICE
      # Raw and packet sockets (needed for handling DHCPv6 requests, and verifying that an IP is not in use before leasing it)
      # - NET_RAW
      # Pi-hole as NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    cap_drop:
      - ALL
    container_name: pihole
    deploy:
      resources:
        limits:
          cpus: ${DEFAULT_CPU_LIMIT}
          memory: ${DEFAULT_MEM_LIMIT}
          pids: ${DEFAULT_PID_LIMIT}
    dns:
      - 127.0.0.1
      - ${DNS_SERVER_1}
      - ${DNS_SERVER_2}
    env_file: config/.env
    hostname: pihole
    image: ${PIHOLE_IMAGE}
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.pihole.entrypoints=web,websecure"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_HOST}`)"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pihole.tls.domains[0].main=${PIHOLE_HOST}"
      - "traefik.http.routers.pihole.middlewares=pihole-cors"
      - "traefik.http.routers.pihole.service=pihole"
      # Middlewares
      - "traefik.http.middlewares.pihole-cors.headers.accessControlAllowHeaders=*"
      - "traefik.http.middlewares.pihole-cors.headers.accessControlAllowMethods=GET,POST"
      - "traefik.http.middlewares.pihole-cors.headers.accessControlAllowOriginList=https://${HOMER_HOST}"
      - "traefik.http.middlewares.pihole-cors.headers.accessControlMaxAge=100"
      - "traefik.http.middlewares.pihole-cors.headers.addVaryHeader=true"
      # Services
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    memswap_limit: ${DEFAULT_MEM_LIMIT}
    networks:
      proxy-net:
        ipv4_address: ${PIHOLE_IP}
      dns-net:
        ipv4_address: ${PIHOLE_DNS_IP}
      monitoring-net:
        ipv4_address: ${PIHOLE_MONITORING_IP}
    ports:
      # DNS Ports
      - ${PIHOLE_DNS_PORT}:53/tcp
      - ${PIHOLE_DNS_PORT}:53/udp
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- 67:67/udp
      # HTTP Port
      - 80
      # Uncomment the line below if you are using Pi-hole as your NTP server
      - ${PIHOLE_NTP_PORT}:123/udp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    user: ${USER_UID}:${USER_GID}
    volumes:
      # run `touch ./pihole.log` first unless you like errors
      - /opt/persistence/pihole/pihole.log:/var/log/pihole.log
      - /opt/persistence/pihole/etc-pihole:/etc/pihole
      - /opt/persistence/pihole/etc-dnsmasqd:/etc/dnsmasq.d

networks:
  proxy-net:
    external: true
    name: traefik-net
  dns-net:
    external: true
    name: dns-net
  monitoring-net:
    external: true
    name: monitoring-net
